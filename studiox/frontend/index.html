<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B0B0D">
  <title>Projetos | StudioX</title>
  <link rel="icon" type="image/svg+xml" href="images/icon.svg">
  <meta name="description" content="Seus projetos de vídeo salvos: abra no editor, acompanhe a fila de edição automática e baixe os vídeos prontos.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css?v=1">
  <link rel="stylesheet" href="css/studio.css?v=8">
  <link rel="stylesheet" href="css/pages.css?v=15">
  <link rel="stylesheet" href="css/embed.css?v=1">
  <script src="js/embed.js?v=1"></script>
</head>
<body class="dark-theme page-body">
  <div class="app-shell">
    <aside class="sidebar" aria-label="Navegação principal">
      <a href="/studiox/" class="sidebar-brand brand-link" title="StudioX" aria-label="StudioX">
        <img src="images/logo-white.svg" alt="StudioX" class="brand-logo">
        <img src="images/icon.svg" alt="" class="brand-icon">
      </a>
      <nav class="sidebar-nav" aria-label="Telas">
        <span class="nav-label">Workspace</span>
        <a href="/studiox/" class="nav-item active" title="Projetos" aria-current="page">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"></rect><rect x="14" y="3" width="7" height="5" rx="1.5"></rect><rect x="14" y="12" width="7" height="9" rx="1.5"></rect><rect x="3" y="16" width="7" height="5" rx="1.5"></rect></svg>
          <span class="nav-text">Projetos</span>
        </a>
        <a href="/studiox/clips.html" class="nav-item" title="Cortes com IA">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"></path></svg>
          <span class="nav-text">Cortes com IA</span>
        </a>
        <a href="/studiox/queue.html" class="nav-item" title="Fila de edição">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h11M4 12h11M4 18h7"></path><path d="m18 14 4 3-4 3z"></path></svg>
          <span class="nav-text">Fila de edição</span><span class="nav-count" id="nav-queue-count"></span>
        </a>
        <a href="/studiox/editor.html" class="nav-item" title="Editor">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="6" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"></path></svg>
          <span class="nav-text">Editor</span>
        </a>
        <a href="/studiox/settings.html" class="nav-item" title="Configurações">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>
          <span class="nav-text">Configurações</span>
        </a>
      </nav>
    </aside>

    <div class="app-main">
      <header class="app-header">
        <div class="header-left">
          <nav class="crumbs" aria-label="Você está em"><span class="crumb-root">StudioX</span><span class="crumb-sep">/</span><span class="crumb-current">Projetos</span></nav>
        </div>
        <div class="header-right">
          <a href="/studiox/queue.html" class="btn btn-accent btn-sm">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"></path></svg>
            Adicionar vídeos à fila
          </a>
        </div>
      </header>

      <div class="page-scroll">
        <main class="page-main">
          <div class="page-head">
            <div>
              <h1 class="page-title">Projetos</h1>
              <p class="page-sub" id="page-sub">Carregando…</p>
            </div>
            <div class="head-actions">
              <a href="/studiox/editor.html" class="btn btn-secondary btn-sm">Abrir o editor vazio</a>
            </div>
          </div>

          <div id="queue-banner" class="queue-banner" hidden>
            <span id="queue-banner-text"></span>
            <a href="/studiox/queue.html" class="btn btn-secondary btn-xs">Ver a fila</a>
          </div>

          <div class="toolbar">
            <input type="search" id="search" class="text-input search" placeholder="Buscar projeto…" autocomplete="off">
            <div class="filter-chips" id="filters">
              <button type="button" class="chip active" data-filter="all">Todos</button>
              <button type="button" class="chip" data-filter="draft">Rascunhos</button>
              <button type="button" class="chip" data-filter="queue">Na fila</button>
              <button type="button" class="chip" data-filter="rendered">Renderizados</button>
              <button type="button" class="chip" data-filter="error">Com erro</button>
            </div>
            <label class="check-inline"><input type="checkbox" id="show-demos"> mostrar vídeos de demonstração</label>
          </div>

          <div id="grid" class="project-grid">
            <div class="loader-row loader-block"><img src="images/loader.gif" alt="" class="loader"><span>Carregando projetos…</span></div>
          </div>
          <div id="empty" class="empty-page" hidden></div>
        </main>
      </div>
    </div>
  </div>

  <div id="lightbox" class="lightbox" hidden>
    <button class="btn-close" id="lightbox-close" title="Fechar">&times;</button>
    <video id="lightbox-video" controls playsinline></video>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/icons.js?v=1"></script>
  <script src="js/common.js?v=2"></script>
  <script src="js/projects.js?v=6"></script>
</body>
</html>
