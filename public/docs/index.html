<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CollabSuite - Documentação da API Pública</title>
  <link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui.css" />
  <style>
    html {
      box-sizing: border-box;
      overflow: -moz-scrollbars-vertical;
      overflow-y: scroll;
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      margin: 0;
      background: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    /* Estilização básica para o cabeçalho superior do Swagger */
    .swagger-ui .topbar {
      background-color: #1e1b4b; /* Indigo escuro */
      padding: 10px 0;
    }
    .swagger-ui .topbar a {
      max-width: 250px;
    }
    .swagger-ui .topbar .download-url-wrapper {
      display: none; /* Esconde a barra de busca de swagger externa */
    }
    .swagger-ui .info {
      margin: 30px 0 20px 0;
    }
    .swagger-ui .info .title {
      font-family: inherit;
      color: #111827;
    }
    .custom-header {
      background-color: #1e1b4b;
      padding: 15px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }
    .custom-header h1 {
      margin: 0;
      color: #ffffff;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .custom-header a {
      color: #e0e7ff;
      text-decoration: none;
      font-size: 14px;
      border: 1px solid #4338ca;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s;
    }
    .custom-header a:hover {
      background-color: #312e81;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <header class="custom-header">
    <h1>CollabSuite API Integrations</h1>
    <a href="../" target="_self">Voltar para o Painel</a>
  </header>

  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-bundle.js" charset="UTF-8"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5.18.2/swagger-ui-standalone-preset.js" charset="UTF-8"></script>
  <script>
    window.onload = function() {
      // Cria a instância do SwaggerUI apontando para a especificação local
      const ui = SwaggerUIBundle({
        url: "openapi.json",
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "BaseLayout",
        defaultModelsExpandDepth: 1,
        defaultModelExpandDepth: 1,
        docExpansion: "list"
      });

      window.ui = ui;
    };
  </script>
</body>
</html>
